name: Spectre PR size warning

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  pull-requests: write

concurrency:
  group: spectre-pr-size-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  warn:
    name: Warn about large PRs
    runs-on: ubuntu-latest
    steps:
      - name: Count reviewable files and update PR metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GENERATED_PREFIXES: '[]'
        # Only GitHub API metadata is read. No PR code is checked out or executed.
        run: |
          node <<'NODE'
          'use strict';
          
          const limit = 35;
          const marker = '<!-- spectre-pr-size-warning:v1 -->';
          const labelName = 'size/XL';
          const token = process.env.GH_TOKEN;
          const repository = process.env.GITHUB_REPOSITORY;
          const prNumber = Number(process.env.PR_NUMBER);
          const apiUrl = process.env.GITHUB_API_URL || 'https://api.github.com';
          const generatedPrefixes = JSON.parse(process.env.GENERATED_PREFIXES || '[]');
          const lockfiles = new Set(['package-lock.json', 'npm-shrinkwrap.json', 'yarn.lock',
            'pnpm-lock.yaml', 'Pipfile.lock', 'poetry.lock', 'Gemfile.lock', 'Cargo.lock',
            'composer.lock', 'gradle.lockfile', 'go.sum']);
          
          if (!token || !/^[^/]+\/[^/]+$/.test(repository || '') || !Number.isSafeInteger(prNumber) || prNumber < 1) {
            throw new Error('Missing or invalid GitHub workflow context');
          }
          
          async function api(method, path, body) {
            const response = await fetch(`${apiUrl}/repos/${repository}${path}`, {
              method,
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${token}`,
                'X-GitHub-Api-Version': '2022-11-28',
                ...(body === undefined ? {} : {'Content-Type': 'application/json'})
              },
              ...(body === undefined ? {} : {body: JSON.stringify(body)})
            });
            if (!response.ok) {
              throw new Error(`GitHub API ${method} ${path} failed: ${response.status} ${await response.text()}`);
            }
            return response.status === 204 ? null : response.json();
          }
          
          async function paged(path, maximumPages) {
            const all = [];
            for (let page = 1; page <= maximumPages; page++) {
              const separator = path.includes('?') ? '&' : '?';
              const batch = await api('GET', `${path}${separator}per_page=100&page=${page}`);
              if (!Array.isArray(batch)) throw new Error(`Incomplete GitHub API response for ${path}`);
              all.push(...batch);
              if (batch.length < 100) return all;
            }
            throw new Error(`GitHub API pagination exceeded ${maximumPages} pages for ${path}`);
          }
          
          function excluded(filename) {
            const name = filename.split('/').pop();
            return lockfiles.has(name) || name.endsWith('.snap') ||
              filename.split('/').includes('__snapshots__') ||
              generatedPrefixes.some(prefix => filename.startsWith(prefix));
          }
          
          function reviewable(file) {
            if (!['added', 'modified', 'removed', 'renamed'].includes(file.status)) {
              throw new Error(`Unexpected file status ${file.status} for ${file.filename}`);
            }
            if (typeof file.filename !== 'string') throw new Error('Missing filename in PR file response');
            if (file.status === 'renamed' && typeof file.previous_filename !== 'string') {
              throw new Error(`Missing previous_filename for renamed file ${file.filename}`);
            }
            // A rename counts once, but moving reviewable content into an excluded path still counts.
            return file.status === 'renamed'
              ? !(excluded(file.filename) && excluded(file.previous_filename || ''))
              : !excluded(file.filename);
          }
          
          async function currentFiles() {
            for (let attempt = 1; attempt <= 3; attempt++) {
              const before = await api('GET', `/pulls/${prNumber}`);
              if (!Number.isSafeInteger(before.changed_files) || before.changed_files < 0) {
                throw new Error('Missing changed_files in current PR response');
              }
              if (before.changed_files > 3000) {
                throw new Error(`PR has ${before.changed_files} changed files; GitHub lists at most 3000`);
              }
              const files = before.changed_files === 0 ? [] : await paged(`/pulls/${prNumber}/files`, 31);
              const after = await api('GET', `/pulls/${prNumber}`);
              if (before.head.sha !== after.head.sha || before.changed_files !== after.changed_files) {
                continue;
              }
              if (files.length !== before.changed_files) {
                throw new Error(`Incomplete PR file list: expected ${before.changed_files}, received ${files.length}`);
              }
              return {pr: after, files};
            }
            throw new Error('PR changed while reading its files; retry on the next event');
          }
          
          async function ensureLabel() {
            const path = `/labels/${encodeURIComponent(labelName)}`;
            const response = await fetch(`${apiUrl}/repos/${repository}${path}`, {
              headers: {Accept: 'application/vnd.github+json', Authorization: `Bearer ${token}`,
                'X-GitHub-Api-Version': '2022-11-28'}
            });
            if (response.ok) return;
            if (response.status !== 404) throw new Error(`GitHub API GET ${path} failed: ${response.status} ${await response.text()}`);
            try {
              await api('POST', '/labels', {name: labelName, color: 'd93f0b',
                description: 'PR exceeds the Spectre reviewable file limit of 35'});
            } catch (error) {
              // Another run or maintainer may have created the same label meanwhile.
              const check = await fetch(`${apiUrl}/repos/${repository}${path}`, {
                headers: {Accept: 'application/vnd.github+json', Authorization: `Bearer ${token}`}
              });
              if (!check.ok) throw error;
            }
          }
          
          async function main() {
            const {pr, files} = await currentFiles();
            const count = files.filter(reviewable).length;
            const comments = await paged(`/issues/${prNumber}/comments`, 100);
            const comment = comments.find(item => item.user?.login === 'github-actions[bot]' &&
              typeof item.body === 'string' && item.body.includes(marker));
            const labeled = pr.labels.some(item => item.name === labelName);
            console.log(`PR #${prNumber}: ${count} reviewable of ${files.length} changed files (limit ${limit})`);
          
            if (count > limit) {
              if (!labeled) {
                await ensureLabel();
                await api('POST', `/issues/${prNumber}/labels`, {labels: [labelName]});
              }
              const message = comment
                ? `This PR currently changes ${count} reviewable files, exceeding the Spectre limit of ${limit}. Please consider splitting it into smaller PRs, or explain why these changes should stay together. This warning does not block merging.`
                : `@${pr.user.login}, this PR changes ${count} reviewable files, exceeding the Spectre limit of ${limit}. Please consider splitting it into smaller PRs, or explain why these changes should stay together. This warning does not block merging.`;
              if (comment) {
                if (comment.body !== `${marker}\n${message}`) {
                  await api('PATCH', `/issues/comments/${comment.id}`, {body: `${marker}\n${message}`});
                }
              } else {
                await api('POST', `/issues/${prNumber}/comments`, {body: `${marker}\n${message}`});
              }
            } else {
              if (labeled) await api('DELETE', `/issues/${prNumber}/labels/${encodeURIComponent(labelName)}`);
              if (comment) {
                const message = `${marker}\nThis PR now changes ${count} reviewable files and meets the Spectre limit of ${limit}.`;
                if (comment.body !== message) await api('PATCH', `/issues/comments/${comment.id}`, {body: message});
              }
            }
          }
          
          main().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
